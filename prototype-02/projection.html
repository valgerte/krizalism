<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Кризализм — проекция</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f6f4f8;
        overflow: hidden;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }
      body.dark {
        background: #211f2b;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .mark {
        position: fixed;
        left: 28px;
        bottom: 22px;
        font-size: 10px;
        letter-spacing: 1.6px;
        color: #8a7e93;
        opacity: 0.55;
        pointer-events: none;
      }
      .mark b {
        display: block;
        font-weight: 400;
        font-size: 18px;
        letter-spacing: -0.4px;
        margin-bottom: 4px;
      }
      .hint {
        position: fixed;
        left: 50%;
        top: 24px;
        transform: translateX(-50%);
        font-size: 12px;
        color: #7d7187;
        background: #ffffffaa;
        border-radius: 99px;
        padding: 8px 16px;
        transition: opacity 1s;
        pointer-events: none;
      }
      .hint.gone {
        opacity: 0;
      }
      .close {
        position: fixed;
        right: 18px;
        top: 16px;
        border: 0;
        border-radius: 99px;
        background: #ffffffcc;
        color: #5d5263;
        font-size: 13px;
        padding: 8px 14px;
        cursor: pointer;
        display: none;
      }
      body.embed .close {
        display: block;
      }
      body.idle,
      body.idle canvas {
        cursor: none;
      }
      body.idle .close {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="mark"><b>кризализм</b>TOUCH TO FEEL · SOUND + VISUAL PLAYGROUND</div>
    <div class="hint" id="hint">двойное нажатие — полный экран</div>
    <button class="close" id="close">× Закрыть проекцию</button>
    <script type="module">
      import { startProjection } from "./projection.js";
      const embed = new URLSearchParams(location.search).has("embed");
      if (embed) document.body.classList.add("embed");
      let ch = null;
      try {
        ch = new BroadcastChannel("krizalizm-projection");
      } catch (e) {}
      const S = startProjection(document.getElementById("c"), (fn) => {
        if (ch) ch.onmessage = (e) => fn(e.data);
        // the overlay inside the page also gets messages straight from its parent
        window.addEventListener("message", (e) => {
          if (e.source === window.parent && e.data && e.data.type) fn(e.data);
        });
      });
      const syncTheme = () => document.body.classList.toggle("dark", S.theme === "dark");
      setInterval(syncTheme, 300);
      if (ch) ch.postMessage({ type: "hello" });
      // double press — fullscreen
      document.addEventListener("dblclick", () => {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen?.().catch(() => {});
      });
      setTimeout(() => document.getElementById("hint").classList.add("gone"), 4000);
      // the cursor hides when the hand is away
      let idle;
      const wake = () => {
        document.body.classList.remove("idle");
        clearTimeout(idle);
        idle = setTimeout(() => document.body.classList.add("idle"), 2200);
      };
      document.addEventListener("pointermove", wake);
      wake();
      document.getElementById("close").onclick = () => parent.postMessage({ type: "projection-close" }, "*");
    </script>
  </body>
</html>
